# .github/workflows/keepalive.yml
# Cron gratuito que llama al endpoint /api/keepalive para que el proyecto de
# Supabase (plan gratuito) no se pause por inactividad (se pausa tras 7 días).
#
# Configuración: GitHub → Settings → Secrets and variables → Actions → Variables
#   KEEPALIVE_URL = https://<tu-app>.vercel.app/api/keepalive
#
# Nota: GitHub desactiva los cron de repos sin commits por 60 días.
# Si eso pasa, reactivarlo desde la pestaña Actions.

name: Supabase Keep-Alive

on:
  schedule:
    # Dos veces al día (08:00 y 20:00 UTC)
    - cron: '0 8,20 * * *'
  workflow_dispatch: # Permite ejecutarlo manualmente desde la UI de GitHub

jobs:
  ping:
    name: Ping Supabase
    runs-on: ubuntu-latest
    timeout-minutes: 2
    if: ${{ vars.KEEPALIVE_URL != '' }}

    steps:
      - name: Ping keepalive endpoint
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 20 \
            "${{ vars.KEEPALIVE_URL }}")
          echo "HTTP Status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "❌ El ping falló con status $STATUS"
            exit 1
          fi
          echo "✅ Supabase despierta — status $STATUS"
