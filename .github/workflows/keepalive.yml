# .github/workflows/keepalive.yml
# Cron job gratuito que llama al endpoint /api/keepalive cada 5 minutos
# para mantener Supabase (plan gratuito) despierta y evitar el cold start.
#
# GitHub Actions permite cron mínimo de 5 minutos.
# El endpoint usa Edge runtime → responde en <200ms sin cold start propio.

name: Supabase Keep-Alive

on:
  schedule:
    # Cada 5 minutos, las 24 horas, los 7 días de la semana
    - cron: '*/5 * * * *'
  workflow_dispatch: # Permite ejecutarlo manualmente desde la UI de GitHub

jobs:
  ping:
    name: Ping Supabase
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Ping keepalive endpoint
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 10 \
            "https://solicitudpa-ol.vercel.app/api/keepalive")
          echo "HTTP Status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "❌ El ping falló con status $STATUS"
            exit 1
          fi
          echo "✅ Supabase despierta — status $STATUS"
